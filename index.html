<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thavishka Abeysekara | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo">
            <span>Thavishka</span>
        </div>
        
        <nav class="nav-links">
            <ul>
                <li><a href="#about">About Me</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>

        <div class="hamburger">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <main class="hero">
        
        <div class="hero-text text-left">
            <h3 class="greeting">Hello, I'm</h3>
            <h1 class="name">Thavishka<br>Abeysekara</h1>
        </div>

        <div class="hero-image-container">
            <div class="glow-effect"></div>
            <img src="images/profile.png" alt="Thavishka Abeysekara" class="profile-img">
        </div>

        <div class="hero-text text-right">
            <h3 class="role-prefix">Creative</h3>
            <h1 class="role-title"><span class="highlight">Developer</span><br>& Designer</h1>
        </div>

    </main>

    <div class="bottom-container">
        <div class="social-icons">
            <a href="#" aria-label="LinkedIn"><i class="fab fa-linkedin-in"></i></a>
            <a href="#" aria-label="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
            <a href="#" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        </div>

        <div class="resume-container">
            <a href="#" class="btn-resume">Resume <i class="fas fa-file-alt"></i></a>
        </div>
    </div>

    <script>
        const hamburger = document.querySelector('.hamburger');
        const navLinks = document.querySelector('.nav-links');

        hamburger.addEventListener('click', () => {
            navLinks.classList.toggle('active');
        });
    </script>
</body>
</html>
